<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter API Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      font-family: monospace;
    }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 4px;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>OpenRouter API Test</h1>

  <div class="input-group">
    <label for="apiKey">OpenRouter API Key:</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-...">
  </div>

  <div class="input-group">
    <label for="model">Model:</label>
    <input type="text" id="model" value="openai/gpt-oss-20b:free">
  </div>

  <button onclick="testAPI()">Test API</button>

  <div id="output"></div>

  <script>
    async function testAPI() {
      const apiKey = document.getElementById('apiKey').value;
      const model = document.getElementById('model').value;
      const output = document.getElementById('output');

      if (!apiKey) {
        output.innerHTML = '<span class="error">Please enter API key</span>';
        return;
      }

      output.innerHTML = 'Testing API connection...\n';

      try {
        // Simple test request
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin,
            'X-Title': 'JobAssist API Test'
          },
          body: JSON.stringify({
            model: model,
            messages: [
              {
                role: 'system',
                content: 'You are a helpful assistant. Respond with valid JSON only.'
              },
              {
                role: 'user',
                content: 'Return a JSON object with a single field "test" set to "success". Just the JSON, nothing else.'
              }
            ],
            response_format: { type: 'json_object' },
            temperature: 0.1
          })
        });

        output.innerHTML += `Response Status: ${response.status} ${response.statusText}\n\n`;

        if (!response.ok) {
          const errorText = await response.text();
          output.innerHTML += '<span class="error">Error Response:</span>\n';
          output.innerHTML += errorText.substring(0, 500) + '\n';
          return;
        }

        const data = await response.json();

        output.innerHTML += '<span class="success">✓ API Call Successful!</span>\n\n';
        output.innerHTML += 'Full Response:\n';
        output.innerHTML += JSON.stringify(data, null, 2);

        // Try to parse the content
        if (data.choices && data.choices[0] && data.choices[0].message) {
          output.innerHTML += '\n\nExtracted Content:\n';
          output.innerHTML += data.choices[0].message.content;
        }

      } catch (error) {
        output.innerHTML += '<span class="error">Error: ' + error.message + '</span>\n';
        output.innerHTML += error.stack;
      }
    }
  </script>
</body>
</html>
